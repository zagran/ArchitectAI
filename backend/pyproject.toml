[tool.poetry]
name = "architectai-backend"
version = "0.1.0"
description = "AI-Powered System Architecture Generator using Amazon Nova"
authors = ["Serhii Zahranychnyi <zagranlab@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.129.0"
uvicorn = "^0.40.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.0"
asyncpg = "^0.31.0"
sqlalchemy = "^2.0.46"
alembic = "^1.18.4"
botocore = "^1.42.49"
aiobotocore = "^3.1.3"
httpx = "^0.28.1"
aiofiles = "^25.1.0"
aioredis = "^2.0.1"
orjson = "^3.11.7"
python-multipart = "^0.0.22"
python-jose = "^3.5.0"
passlib = "^1.7.4"
python-decouple = "^3.8"
structlog = "^25.5.0"
prometheus-client = "^0.24.1"
dumb-init = "^1.2.5.post1"
bcrypt = "^4.0.1"
boto3 = "^1.42.49"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
